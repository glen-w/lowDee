[package]
name = "low-d"
version = "0.1.0"
description = "Low D whistle practice companion"
authors = ["whistle"]
edition = "2021"
default-run = "low-d"

[lib]
name = "low_d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "listen"
path = "src/bin/listen.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15"
parking_lot = "0.12"
thiserror = "2"
hound = "3.5"
sha2 = "0.10.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
